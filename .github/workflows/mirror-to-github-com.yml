# Sync this repository (GHE canonical) to GitHub.com for Cursor Remote Rules.
# Requires repository secret: MIRROR_TO_GITHUB_COM_TOKEN

name: Mirror to GitHub.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mirror-to-github-com
  cancel-in-progress: false

jobs:
  mirror:
    # Match org runner labels (self-hosted, Linux, X64). Use self-hosted alone if jobs stay pending.
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror branches and tags to GitHub.com
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TO_GITHUB_COM_TOKEN }}
          MIRROR_URL: https://github.com/atsushi-sanada/cursor-rules.git
        run: |
          set -euo pipefail

          if [ -z "${MIRROR_TOKEN}" ]; then
            echo "::error::Secret MIRROR_TO_GITHUB_COM_TOKEN is not set on this repository."
            exit 1
          fi

          git remote remove mirror 2>/dev/null || true
          git remote add mirror "https://x-access-token:${MIRROR_TOKEN}@github.com/atsushi-sanada/cursor-rules.git"

          git push --prune mirror \
            "+refs/heads/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"

          git remote remove mirror
